<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拖拽排序</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
     
    h1 {
      margin: 20px auto;
      text-align: center
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 50%;
      margin: auto;
      position: relative;
    }
    .container::before{
      content: '';
      display: block;
      width: 100%;
      height: 2px;
      background: skyblue;
      position: absolute;
      top: -5px;
      left: 0;
      transform: translateY(var(--top));
      opacity: var(--opacity);
    }

    .container div {
      height: 50px;
      background-color: #4CAF50;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      border-radius: 5px;
    }


    .container div.dragging {
      background-color: skyblue;
    }
  </style>
</head>
<body>
  <h1>拖拽排序</h1>
  <div class="container" style="--top: 0px; --opacity:0;">
    <div draggable="true">1</div>
    <div draggable="true">2</div>
    <div draggable="true">3</div>
    <div draggable="true">4</div>
    <div draggable="true">5</div>
    <div draggable="true">6</div>
    <div draggable="true">7</div>
    <div draggable="true">8</div>
    <div draggable="true">9</div>
    <div draggable="true">10</div>
  </div>

  <script>
    const container = document.querySelector('.container');
    const draggables = document.querySelectorAll('.container div');

    let draggingDiv = null
    let dragoverDiv = null
    let startMap = new Map()
    let isBefore = false
    draggables.forEach(draggable => {
      draggable.addEventListener('dragstart', () => {
        draggingDiv = draggable;
        draggable.classList.add('dragging')
        const newdraggables = document.querySelectorAll('.container div')
        startMap.clear();
        newdraggables.forEach((item, index) => {
          startMap.set(item, item.offsetTop)
        })
        console.log('[ startMap ] >', startMap)
      })

      draggable.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragoverDiv = e.target;
        // console.dir(dragoverDiv)
        // console.log('[ e ] >', e.offsetY, dragoverDiv.offsetTop, dragoverDiv.offsetHeight)
        isBefore = e.offsetY < dragoverDiv.offsetHeight / 2;
        if (dragoverDiv === draggingDiv)  {
          container.setAttribute('style', '--opacity: 0;')
        } else {
          // const top = isBefore ? dragoverDiv.offsetTop : dragoverDiv.offsetTop + dragoverDiv.offsetHeight + 10;
          const nextTop = dragoverDiv.nextElementSibling ? dragoverDiv.nextElementSibling.offsetTop : container.offsetHeight + 10
          const top = isBefore ? dragoverDiv.offsetTop : nextTop
          container.setAttribute('style', `--opacity: 1;--top:${top}px;`)
        }

      });

      draggable.addEventListener('dragend', (e) => {
        draggable.classList.remove('dragging')
        const newdraggables = document.querySelectorAll('.container div')
        const startIndex = Array.from(newdraggables).indexOf(draggingDiv)
        const endIndex = Array.from(newdraggables).indexOf(dragoverDiv)
        // console.log('[ startIndex, endIndex ] >', startIndex, endIndex)
        container.setAttribute('style', '--opacity: 0;')
        if (isBefore) {
          dragoverDiv.insertAdjacentElement('beforebegin', draggingDiv);
        } else {
          dragoverDiv.insertAdjacentElement('afterend', draggingDiv);
        }
        const newdraggables2 = document.querySelectorAll('.container div')
        const endMap = new Map();
        newdraggables2.forEach((item, index) => {
          const itemOffsetTop = startMap.get(item) - item.offsetTop
          if (itemOffsetTop) {
            endMap.set(item, startMap.get(item) - item.offsetTop)
          }
        })
        console.log('[ endMap ] >', endMap)
        const mapArr = Array.from(endMap);
        mapArr.forEach((item, index) => {
          console.log('[ item, index ] >', item, index)
          item[0].animate([
            {
              transform: `translate(0, ${item[1]}px)`
            },
            {
              transform: 'translate(0, 0) '
            }
          ], {
            duration: item[0] === e.target ? (mapArr.length - 1) * 100 + 300 : 300,
            easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
            delay: item[0] === e.target ? 0 : (startIndex < endIndex ? index : mapArr.length - index) * 100,
            fill: 'both'
          })
        })
      });
    });

  </script>
</body>
</html>
