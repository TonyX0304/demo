<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./reset.css">
  <style>
  </style>
</head>
<body>
  <style>
    .button {
      margin: 50px auto;
      border-color: aqua;
      background-color: rgb(17, 115, 84);
      max-width: fit-content;
      padding: 8px;
      border-radius: 8px;
      color: white;
      position: relative;
      cursor: pointer;
    }

    ul {
      position: absolute;
      top: 100%;
      left: 0;
      padding: 0 8px;
      min-width: 100%;
      box-sizing: border-box;
      background-color: yellowgreen;
      border-radius: 8px;
      display: none;
    }

    li {
      line-height: 32px;
    }
  </style>
  <div class="button">
    <span>点击一下啊</span>
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
    </ul>
  </div>

  <script>
    const button = document.querySelector('.button');
    const ul = button.querySelector('ul');
    button.addEventListener('click', throttle((e) => {
      e.stopPropagation();
      const isShow = ul.style.display === 'block';
      ul.style.display = 'block'; // 先显示出来，获取高度
      ul.style.height = 'auto';
      const height = ul.scrollHeight;
      void ul.offsetHeight;
      console.log('[ ul ] >', ul.offsetHeight)
      const startHeight = isShow ? height + 'px' : '0px';
      const endHeight = isShow ? '0px' : height + 'px';
      console.log('[ startHeight, endHeight ] >', startHeight, endHeight)
      ul.style.height = 0;
      ul.animate([{
        height: startHeight
      }, {
        height: endHeight
      }], {
        duration: 300,
        fill: 'forwards',
        easing: 'ease-in-out'      
      })
        .onfinish = () => {   
          ul.style.height = endHeight + 'px';
          
          ul.style.display = isShow ? 'none' : 'block';
        };
    }, 350));

    /**
     * 防抖函数
     * @param {Function} fn 需要防抖的函数
     * @param {number} delay 延迟时间，单位毫秒
     * @returns {Function} 返回一个新的函数
     */
    function debounce(fn, delay) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => {
          fn.apply(this, args);
        }, delay);
      };
    }

    /**
     * 节流函数
     * @param {Function} fn 需要节流的函数
     * @param {number} delay 延迟时间，单位毫秒
     * @returns {Function} 返回一个新的函数
     */
    function throttle(fn, delay) {
      let lastTime = 0;
      return function (...args) {
        const now = Date.now();
        if (now - lastTime >= delay) {
          lastTime = now;
          fn.apply(this, args);
        }
      };
    }
  </script>
</body>
</html>
